<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 216" width="1200" height="216" role="img" aria-label="Career: Software Developer at MAQ Software (2016), Data Scientist, Senior and Principal Data Scientist at Kvantum (2017 to 2021), Data Science Manager and Senior Data Science Manager at Yum! Brands (2021 to now)">
  <title>Career timeline, 2016 to now</title>
  <defs>
    <linearGradient id="tl" gradientUnits="userSpaceOnUse" x1="60" x2="1140" y1="0" y2="0">
      <stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <line x1="60" x2="1140" y1="80" y2="80" stroke="#eaeef2" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" x2="60" y1="80" y2="80" stroke="url(#tl)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x2" from="60" to="1140" begin="0.2s" dur="2.2s" fill="freeze"/>
    </line>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.5s" fill="freeze"/>
      <text x="110" y="54" font-size="16" font-weight="600" text-anchor="middle" fill="#0969da">2016</text>
      
      <circle cx="110" cy="80" r="9" fill="#ffffff" stroke="url(#tl)" stroke-width="3"/>
      <circle cx="110" cy="80" r="4" fill="#0969da"/>
      <text x="110" y="146" font-size="15" font-weight="500" text-anchor="middle" fill="#1f2328">Software</text><text x="110" y="166" font-size="15" font-weight="500" text-anchor="middle" fill="#1f2328">Developer</text>
      <text x="110" y="192" font-size="14" text-anchor="middle" fill="#59636e">MAQ Software</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.5s" fill="freeze"/>
      <text x="306" y="54" font-size="16" font-weight="600" text-anchor="middle" fill="#0969da">2017</text>
      
      <circle cx="306" cy="80" r="9" fill="#ffffff" stroke="url(#tl)" stroke-width="3"/>
      <circle cx="306" cy="80" r="4" fill="#0969da"/>
      <text x="306" y="146" font-size="15" font-weight="500" text-anchor="middle" fill="#1f2328">Data</text><text x="306" y="166" font-size="15" font-weight="500" text-anchor="middle" fill="#1f2328">Scientist</text>
      <text x="306" y="192" font-size="14" text-anchor="middle" fill="#59636e">Kvantum Inc.</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.00s" dur="0.5s" fill="freeze"/>
      <text x="502" y="54" font-size="16" font-weight="600" text-anchor="middle" fill="#0969da">2019</text>
      
      <circle cx="502" cy="80" r="9" fill="#ffffff" stroke="url(#tl)" stroke-width="3"/>
      <circle cx="502" cy="80" r="4" fill="#0969da"/>
      <text x="502" y="146" font-size="15" font-weight="500" text-anchor="middle" fill="#1f2328">Senior Data</text><text x="502" y="166" font-size="15" font-weight="500" text-anchor="middle" fill="#1f2328">Scientist</text>
      <text x="502" y="192" font-size="14" text-anchor="middle" fill="#59636e">Kvantum Inc.</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.35s" dur="0.5s" fill="freeze"/>
      <text x="698" y="54" font-size="16" font-weight="600" text-anchor="middle" fill="#0969da">2020</text>
      
      <circle cx="698" cy="80" r="9" fill="#ffffff" stroke="url(#tl)" stroke-width="3"/>
      <circle cx="698" cy="80" r="4" fill="#0969da"/>
      <text x="698" y="146" font-size="15" font-weight="500" text-anchor="middle" fill="#1f2328">Principal Data</text><text x="698" y="166" font-size="15" font-weight="500" text-anchor="middle" fill="#1f2328">Scientist</text>
      <text x="698" y="192" font-size="14" text-anchor="middle" fill="#59636e">Kvantum Inc.</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.70s" dur="0.5s" fill="freeze"/>
      <text x="894" y="54" font-size="16" font-weight="600" text-anchor="middle" fill="#0969da">2021</text>
      
      <circle cx="894" cy="80" r="9" fill="#ffffff" stroke="url(#tl)" stroke-width="3"/>
      <circle cx="894" cy="80" r="4" fill="#0969da"/>
      <text x="894" y="146" font-size="15" font-weight="500" text-anchor="middle" fill="#1f2328">Data Science</text><text x="894" y="166" font-size="15" font-weight="500" text-anchor="middle" fill="#1f2328">Manager</text>
      <text x="894" y="192" font-size="14" text-anchor="middle" fill="#59636e">Yum! Brands</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.05s" dur="0.5s" fill="freeze"/>
      <text x="1090" y="54" font-size="16" font-weight="600" text-anchor="middle" fill="#8250df">2022 – now</text>
      <circle cx="1090" cy="80" r="9" fill="none" stroke="#8250df" stroke-width="2"><animate attributeName="r" values="9;22" dur="1.8s" begin="2.45s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.8s" begin="2.45s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="80" r="9" fill="#ffffff" stroke="url(#tl)" stroke-width="3"/>
      <circle cx="1090" cy="80" r="5" fill="#8250df"/>
      <text x="1090" y="146" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2328">Senior Data Science</text><text x="1090" y="166" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2328">Manager</text>
      <text x="1090" y="192" font-size="14" text-anchor="middle" fill="#59636e">Yum! Brands</text>
    </g>
  </g>
</svg>
