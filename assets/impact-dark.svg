<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Impact: 5M+ daily users, +10% conversion, 2,000+ stores forecast, +25% forecast accuracy">
  <title>Impact: 5M+ daily users, +10% conversion, 2,000+ stores forecast, +25% forecast accuracy</title>
  <defs>
    <linearGradient id="val" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g opacity="0" transform="translate(0 12)">
      <animate attributeName="opacity" from="0" to="1" begin="0.0s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin="0.0s" dur="0.6s" fill="freeze"/>
      <rect x="30" y="20" width="270" height="170" rx="14" fill="#161b22" stroke="#30363d"/>
      <text x="54" y="86" font-size="46" font-weight="700" fill="url(#val)">5M+</text>
      <rect x="54" y="104" width="0" height="3" rx="1.5" fill="url(#val)">
        <animate attributeName="width" values="0;64;64" keyTimes="0;0.15;1" begin="0.3s" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="54" y="140" font-size="16" fill="#e6edf3">daily users served by</text>
      <text x="54" y="164" font-size="16" fill="#8b949e">a two-tower recommender</text>
    </g>
    <g opacity="0" transform="translate(0 12)">
      <animate attributeName="opacity" from="0" to="1" begin="0.25s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin="0.25s" dur="0.6s" fill="freeze"/>
      <rect x="320" y="20" width="270" height="170" rx="14" fill="#161b22" stroke="#30363d"/>
      <text x="344" y="86" font-size="46" font-weight="700" fill="url(#val)">+10%</text>
      <rect x="344" y="104" width="0" height="3" rx="1.5" fill="url(#val)">
        <animate attributeName="width" values="0;64;64" keyTimes="0;0.15;1" begin="0.55s" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="344" y="140" font-size="16" fill="#e6edf3">conversion lift from</text>
      <text x="344" y="164" font-size="16" fill="#8b949e">a propensity model</text>
    </g>
    <g opacity="0" transform="translate(0 12)">
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin="0.5s" dur="0.6s" fill="freeze"/>
      <rect x="610" y="20" width="270" height="170" rx="14" fill="#161b22" stroke="#30363d"/>
      <text x="634" y="86" font-size="46" font-weight="700" fill="url(#val)">2,000+</text>
      <rect x="634" y="104" width="0" height="3" rx="1.5" fill="url(#val)">
        <animate attributeName="width" values="0;64;64" keyTimes="0;0.15;1" begin="0.8s" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="634" y="140" font-size="16" fill="#e6edf3">stores forecast up to</text>
      <text x="634" y="164" font-size="16" fill="#8b949e">4 weeks ahead</text>
    </g>
    <g opacity="0" transform="translate(0 12)">
      <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin="0.75s" dur="0.6s" fill="freeze"/>
      <rect x="900" y="20" width="270" height="170" rx="14" fill="#161b22" stroke="#30363d"/>
      <text x="924" y="86" font-size="46" font-weight="700" fill="url(#val)">+25%</text>
      <rect x="924" y="104" width="0" height="3" rx="1.5" fill="url(#val)">
        <animate attributeName="width" values="0;64;64" keyTimes="0;0.15;1" begin="1.05s" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="924" y="140" font-size="16" fill="#e6edf3">sales-forecast accuracy</text>
      <text x="924" y="164" font-size="16" fill="#8b949e">improvement</text>
    </g>
  </g>
</svg>
